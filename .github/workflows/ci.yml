name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev,dashboard]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Tests (fixtures and fakes only, no network or real LLM)
        run: pytest -q

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install ".[dashboard]" pip-audit
      - name: Audit installed dependencies for known vulnerabilities
        run: pip-audit --skip-editable --progress-spinner off

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build and start API and dashboard
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Check endpoints
        run: |
          curl -fsS http://localhost:8000/healthz
          curl -fsS http://localhost:8000/ready
          curl -fsS http://localhost:8000/api/v1/system/telemetry
          curl -fsS http://localhost:8501/_stcore/health
      - name: Backup inside the container
        run: docker compose run --rm api fedtone backup
      - name: No .env or local data in the image
        run: |
          docker run --rm --entrypoint sh fedtone:local -c \
            'test ! -e /app/.env && test -z "$(ls -A /app/data)" && echo clean'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v
